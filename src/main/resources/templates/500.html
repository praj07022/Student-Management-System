
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="login-body">

<div class="min-vh-100 d-flex align-items-center justify-content-center px-3">

    <div class="text-center" style="max-width: 620px;">

        <!-- Error Icon -->
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-danger bg-opacity-10 text-danger mb-4"
             style="width: 90px; height: 90px;">

            <i class="bi bi-exclamation-triangle fs-1"></i>

        </div>


        <!-- Error Code -->
        <h1 class="display-1 fw-bold text-danger mb-0"
            style="font-size: clamp(6rem, 15vw, 9rem); line-height: 1;">

            500

        </h1>


        <!-- Title -->
        <h2 class="fw-bold text-dark mt-3 mb-2">
            Internal Server Error
        </h2>


        <!-- Description -->
        <p class="text-muted fs-5 mb-4">
            Something went wrong on our end.
            Please try again later.
        </p>


        <!-- Action -->
        <a href="dashboard.html"
           class="btn btn-primary btn-lg px-4">

            <i class="bi bi-house-door me-2"></i>
            Back to Home

        </a>

    </div>

</div>

</body>

</html>
