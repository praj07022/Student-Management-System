
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Application CSS -->
    <link th:href="@{/css/style.css}"
          rel="stylesheet">

</head>


<body>


<!-- ========================================================= -->
<!-- SIDEBAR -->
<!-- ========================================================= -->

<div th:fragment="sidebar"
     class="bg-dark text-white"
     id="sidebar-wrapper">

    <!-- Brand -->
    <div class="sidebar-heading px-4 py-4 border-bottom border-secondary">

        <div class="d-flex align-items-center">

            <div class="rounded-3 bg-primary d-flex align-items-center justify-content-center me-3"
                 style="width: 42px; height: 42px;">

                <i class="bi bi-mortarboard-fill fs-5"></i>

            </div>

            <div>

                <div class="fw-bold fs-5">
                    SMS Admin
                </div>

                <small class="text-white-50">
                    Student Management
                </small>

            </div>

        </div>

    </div>


    <!-- Navigation -->
    <div class="list-group list-group-flush py-3">

        <!-- Dashboard -->
        <a th:href="@{/dashboard}"
           class="sidebar-link d-flex align-items-center">

            <span class="sidebar-icon">
                <i class="bi bi-speedometer2"></i>
            </span>

            <span>
                Dashboard
            </span>

        </a>


        <!-- Courses -->
        <a th:href="@{/course/list}"
           class="sidebar-link active d-flex align-items-center">

            <span class="sidebar-icon">
                <i class="bi bi-book"></i>
            </span>

            <span>
                Courses
            </span>

        </a>


        <!-- Students -->
        <a th:href="@{/students/list}"
           class="sidebar-link d-flex align-items-center">

            <span class="sidebar-icon">
                <i class="bi bi-people"></i>
            </span>

            <span>
                Students
            </span>

        </a>


        <!-- Enrolled Students -->
        <a th:href="@{/enrollments/enrollmentList}"
           class="sidebar-link d-flex align-items-center">

            <span class="sidebar-icon">
                <i class="bi bi-check2-square"></i>
            </span>

            <span>
                Enrolled Students
            </span>

        </a>


        <!-- Enroll to Course -->
        <a th:href="@{/enrollments/showEnroll}"
           class="sidebar-link d-flex align-items-center">

            <span class="sidebar-icon">
                <i class="bi bi-person-plus"></i>
            </span>

            <span>
                Enroll to Course
            </span>

        </a>

    </div>


    <!-- Logout -->
    <div class="mt-auto px-3 pb-3">

        <form method="post"
              th:action="@{/logout}"
              class="sidebar-link border-top border-secondary pt-3 d-flex align-items-center">

            <!-- CSRF -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <button type="submit"
                    class="btn btn-link text-white text-decoration-none d-flex align-items-center w-100 p-0">

                <span class="sidebar-icon">
                    <i class="bi bi-box-arrow-right"></i>
                </span>

                <span>
                    Logout
                </span>

            </button>

        </form>

    </div>

</div>


<!-- ========================================================= -->
<!-- NAVBAR -->
<!-- ========================================================= -->

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">

    <div class="container-fluid px-4">

        <!-- Sidebar Toggle -->
        <button class="btn btn-light border"
                id="sidebarToggle"
                type="button"
                aria-label="Toggle sidebar">

            <i class="bi bi-list fs-5"></i>

        </button>


        <!-- Mobile Navbar Toggle -->
        <button class="navbar-toggler ms-auto"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- Existing Navbar Content
             Kept commented as in the original layout. -->

        <!--
        <div class="collapse navbar-collapse"
             id="navbarSupportedContent">

            <ul class="navbar-nav ms-auto mt-2 mt-lg-0">

                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle"
                       href="#"
                       id="navbarDropdown"
                       role="button"
                       data-bs-toggle="dropdown">

                        <i class="bi bi-person-circle me-1"></i>
                        Admin User

                    </a>

                    <div class="dropdown-menu dropdown-menu-end">

                        <a class="dropdown-item" href="#">
                            Profile
                        </a>

                        <a class="dropdown-item" href="#">
                            Settings
                        </a>

                        <div class="dropdown-divider"></div>

                        <a class="dropdown-item"
                           href="login.html">
                            Logout
                        </a>

                    </div>

                </li>

            </ul>

        </div>
        -->

    </div>

</nav>


<!-- ========================================================= -->
<!-- FOOTER -->
<!-- ========================================================= -->

<footer th:fragment="footer"
        class="py-4 bg-white mt-auto border-top">

    <div class="container-fluid px-4">

        <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-2 small">

            <div class="text-muted">

                <i class="bi bi-mortarboard me-1"></i>

                Copyright &copy; Student Management System 2023

            </div>


            <div>

                <a href="#"
                   class="text-decoration-none text-muted">

                    Privacy Policy

                </a>

                <span class="text-muted mx-2">
                    &middot;
                </span>

                <a href="#"
                   class="text-decoration-none text-muted">

                    Terms &amp; Conditions

                </a>

            </div>

        </div>

    </div>

</footer>


<!-- ========================================================= -->
<!-- SCRIPTS -->
<!-- ========================================================= -->

<th:block th:fragment="scripts">

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Sidebar Toggle -->
    <script>

        window.addEventListener('DOMContentLoaded', event => {

            const sidebarToggle =
                document.body.querySelector('#sidebarToggle');

            if (sidebarToggle) {

                sidebarToggle.addEventListener('click', event => {

                    event.preventDefault();

                    document.body.classList.toggle(
                        'sb-sidenav-toggled'
                    );

                });

            }

        });

    </script>

</th:block>


</body>
</html>
