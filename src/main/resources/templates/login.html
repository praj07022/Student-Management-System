
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="login-body">

<div class="min-vh-100 d-flex align-items-center justify-content-center p-3">

    <div class="row w-100 justify-content-center">

        <div class="col-12 col-md-9 col-lg-7 col-xl-5">

            <div class="card border-0 shadow-lg overflow-hidden">

                <!-- Header -->
                <div class="bg-primary text-white text-center px-4 py-5">

                    <div class="d-inline-flex align-items-center justify-content-center rounded-4 bg-white bg-opacity-10 mb-3"
                         style="width: 64px; height: 64px;">

                        <i class="bi bi-mortarboard-fill fs-2"></i>

                    </div>

                    <h2 class="fw-bold mb-1">
                        Student Management System
                    </h2>

                    <p class="mb-0 opacity-75">
                        Manage students, courses, and enrollments
                    </p>

                </div>


                <!-- Login Form -->
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <h4 class="fw-bold mb-2">
                            Welcome Back
                        </h4>

                        <p class="text-muted mb-0">
                            Sign in to continue to your dashboard
                        </p>

                    </div>


                    <!-- Login Error -->
                    <div th:if="${param.error}"
                         class="alert alert-danger border-0 d-flex align-items-center"
                         role="alert">

                        <i class="bi bi-exclamation-circle me-2"></i>

                        <span>
                            Invalid username or password. Please try again.
                        </span>

                    </div>


                    <!-- Logout Message -->
                    <div th:if="${param.logout}"
                         class="alert alert-success border-0 d-flex align-items-center">

                        <i class="bi bi-check-circle me-2"></i>

                        <span>
                            You have been logged out successfully.
                        </span>

                    </div>


                    <!-- Custom Message -->
                    <div th:if="${message}"
                         class="alert alert-danger border-0 d-flex align-items-center"
                         role="alert"
                         th:text="${message}">

                        <i class="bi bi-exclamation-triangle me-2"></i>

                    </div>


                    <form th:action="@{/login}" method="post">

                        <!-- CSRF -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>


                        <!-- Username -->
                        <div class="mb-4">

                            <label for="email"
                                   class="form-label fw-semibold">
                                Username
                            </label>

                            <div class="input-group">

                                <span class="input-group-text bg-light border-end-0 px-3">
                                    <i class="bi bi-person text-muted"></i>
                                </span>

                                <input type="text"
                                       class="form-control bg-light border-start-0 ps-1"
                                       id="email"
                                       name="username"
                                       placeholder="Enter your username"
                                       required>

                            </div>

                        </div>


                        <!-- Password -->
                        <div class="mb-4">

                            <div class="d-flex justify-content-between align-items-center mb-2">

                                <label for="password"
                                       class="form-label fw-semibold mb-0">
                                    Password
                                </label>

                            </div>

                            <div class="input-group">

                                <span class="input-group-text bg-light border-end-0 px-3">
                                    <i class="bi bi-lock text-muted"></i>
                                </span>

                                <input type="password"
                                       class="form-control bg-light border-start-0 ps-1"
                                       id="password"
                                       name="password"
                                       placeholder="Enter your password"
                                       required>

                            </div>

                        </div>


                        <!-- Login Button -->
                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-primary py-2 fw-semibold">

                                <i class="bi bi-box-arrow-in-right me-2"></i>
                                Login

                            </button>

                        </div>

                    </form>

                </div>


                <!-- Footer -->
                <div class="card-footer bg-light border-0 text-center py-3">

                    <small class="text-muted">
                        Student Management System
                    </small>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
